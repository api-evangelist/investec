aid: investec
url: https://raw.githubusercontent.com/api-evangelist/investec/refs/heads/main/apis.yml
name: Investec
kind: company
description: Investec is an international specialist bank and wealth manager, dual-listed on the London
  Stock Exchange and Johannesburg Stock Exchange and operating through Investec plc (UK) and Investec
  Limited (South Africa). In the United Kingdom, Investec Bank plc is authorised by the PRA and regulated
  by the FCA and PRA and is an FCA-registered Account Servicing Payment Service Provider (ASPSP) under
  UK Open Banking, exposing Account and Transaction Information (AIS), Payment Initiation (PIS), and Confirmation
  of Funds (CBPII) interfaces built to the Open Banking Implementation Entity (OBIE) Read/Write API Standard
  (v3.1), secured with FAPI-grade OAuth2/OIDC, PSD2 strong customer authentication, and mutual-TLS using
  OBIE/eIDAS certificates. Investec is a specialist private bank and wealth manager rather than a mass-market
  retail bank, so it is not one of the CMA9 and does not operate a branch or ATM network. Alongside Open
  Banking, Investec runs a first-party Programmable Banking / Open API developer platform at openapi.investec.com
  offering Private Bank, Business & Commercial Banking, Intermediaries, Intermediaries Forex, and Card
  APIs secured with OAuth2 client credentials, published through the Investec Developer Portal at developer.investec.com.
