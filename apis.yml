- aid: investec:investec-account-transaction-information-api
  name: Investec Account and Transaction Information API (AIS)
  description: UK Open Banking Account Information Service (AISP) interface for accessing account, balance,
    transaction, and product data. Investec Bank plc conforms to the OBIE Read/Write API Standard (v3.1);
    the harvested OpenAPI is the shared OBIE standard specification, not an Investec-proprietary contract,
    and is FAPI-secured (OAuth2/OIDC + mTLS + PSD2 SCA).
